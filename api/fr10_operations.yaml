/operations/rides:
  get:
    tags:
      - FR10 - Quản lý vận hành
    summary: Nhân viên vận hành xem toàn bộ danh sách các chuyến đi thực tế
    security:
      - BearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
    responses:
      '200':
        description: Danh sách cuốc xe hệ thống đang vận hành

/operations/drivers/{id}/verify:
  patch:
    tags:
      - FR10 - Quản lý vận hành
    summary: Duyệt hồ sơ tài xế và kiểm định xe
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [APPROVED, REJECTED]
                example: APPROVED
    responses:
      '200':
        description: Phê duyệt hồ sơ thành công